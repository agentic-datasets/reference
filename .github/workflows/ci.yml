name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  harness-purity:
    # The portability claim rests on the conformance package importing no
    # implementation. This job proves the harness runs with none installed --
    # only the toy, which imports the interface and nothing else.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: no framework is installed
        run: |
          python - <<'PY'
          import importlib.util as u
          for m in ("langgraph", "llama_index", "google.adk", "mcp"):
              assert u.find_spec(m) is None, f"{m} should not be installed in this job"
          PY
      - name: the portable suite still runs
        run: python -m agentic_dataset.conformance
      - run: pytest -q

  all-subjects:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[all]"
      - name: portable suite, every subject, plus the mutants
        run: python -m agentic_dataset.conformance --mutants
      - name: white-box suite, 8 configurations
        run: python -m agentic_dataset.reference_suite
      - run: pytest -q
      - name: evaluation and the M6 measurement
        run: |
          python evals/evaluate.py
          python -m agentic_dataset.authorized_recall
      - name: the committed vectors match the generator
        run: |
          python conformance/generate.py
          git diff --exit-code conformance/
