[book]
title = "Agentic Dataset Reference"
authors = ["Alexander Chernov"]
description = "A framework-independent behavioural contract for agentic datasets, expressed as language-neutral executable conformance vectors."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/doytsujin/ok-agentic-dataset-reference"
# No edit-url-template on purpose: every chapter is generated by build.py from
# a file at the repository root, so an "edit this page" link would point at a
# file that the next build overwrites.
site-url = "/ok-agentic-dataset-reference/"
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
